# 用户管理模块测试用例
- case_name: 获取单条存在的用户
  url: /users/2
  method: GET
  expect_status: 200
  expect_user_id: 2

- case_name: 获取不存在用户id
  url: /users/9999
  method: GET
  expect_status: 404


- case_name: 创建新用户
  url: /users
  method: POST
  payload:
    name: "zhangsan"
    job: "tester"
  expect_status: 201

- case_name: 更新用户信息
  url: /users/2
  method: PUT
  payload:
    name: "lisi"
    job: "automation"
  expect_status: 200

- case_name: 删除用户
  url: /users/2
  method: DELETE
  expect_status: 204

- case_name: 查询不存在用户id，返回404
  url: /users/23
  method: GET
  expect_status: 404
